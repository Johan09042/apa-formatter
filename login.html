<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body {
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#020617;
    color:white;
    font-family:sans-serif;
}
.card {
    background:#111827;
    padding:40px;
    border-radius:15px;
    text-align:center;
}
input,button {
    width:100%;
    padding:10px;
    margin-top:10px;
}
</style>
</head>
<body>
<div class="card">
<h2>🔐 Iniciar sesión</h2>
<form method="post">
<input name="usuario" placeholder="Usuario" required>
<input type="password" name="password" placeholder="Contraseña" required>
<button>Entrar</button>
</form>
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
</div>
</body>
</html>
